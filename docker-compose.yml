services:
  death-metal-fetch:
    build: .
    ports:
      - "3847:3847"
    environment:
      BSKY_HANDLE: ${BSKY_HANDLE:-kmanriffs.bsky.social}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-120000}
      CALLMEBOT_PHONE: ${CALLMEBOT_PHONE:-}
      CALLMEBOT_APIKEY: ${CALLMEBOT_APIKEY:-}
      POLL_SECRET: ${POLL_SECRET:-}
      DATABASE_PATH: /data/releases.db
    volumes:
      - dmf-data:/data
    restart: unless-stopped

volumes:
  dmf-data:
