# Free always-on deploy: https://fly.io
#
# Exact path (also: ./scripts/fly-deploy.sh --print-only):
#   1) flyctl auth login
#   2) flyctl apps create death-metal-fetch   # or rename app= below if taken
#   3) flyctl volumes create dmf_data --size 1 --region iad --app death-metal-fetch --yes
#   4) flyctl secrets set CALLMEBOT_PHONE=... CALLMEBOT_APIKEY=... POLL_SECRET="$(openssl rand -hex 24)"
#   5) flyctl deploy
# Public HTTPS only after deploy succeeds: https://<app>.fly.dev
# Temporary tunnels are NOT permanent hosting.

app = "death-metal-fetch"
primary_region = "iad"

[build]

[env]
  PORT = "3847"
  HOSTNAME = "0.0.0.0"
  DATABASE_PATH = "/data/releases.db"
  BSKY_HANDLE = "kmanriffs.bsky.social"
  POLL_INTERVAL_MS = "120000"

[http_service]
  internal_port = 3847
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "dmf_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
