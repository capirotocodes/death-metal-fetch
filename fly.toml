# Free-ish always-on deploy: https://fly.io
# 1) fly auth login
# 2) fly launch --no-deploy   (or fly apps create death-metal-fetch)
# 3) fly volumes create dmf_data --size 1 --region <region>
# 4) fly secrets set CALLMEBOT_PHONE=... CALLMEBOT_APIKEY=... POLL_SECRET=...
# 5) fly deploy

app = "death-metal-fetch"
primary_region = "iad"

[build]

[env]
  PORT = "3847"
  HOSTNAME = "0.0.0.0"
  DATABASE_PATH = "/data/releases.db"
  BSKY_HANDLE = "kmanriffs.bsky.social"
  POLL_INTERVAL_MS = "120000"

[http_service]
  internal_port = 3847
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "dmf_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
